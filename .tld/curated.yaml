  direction: forward
  style: bezier
- view: transports
  source: scpi
  target: lines
  label: writes / queries lines
  description: Scpi delegates communication to its injected LineIO object.
  relationship: calls
  direction: forward
  style: bezier
- view: transports
  source: scpi
  target: quantities
  label: returns unit-bearing readings
  description: transports/scpi.py imports Quantity and constructs typed quantity results.
