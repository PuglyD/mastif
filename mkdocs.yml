site_name: mastif
site_description: A domain-neutral framework for automated test equipment
theme:
  name: material
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
  features: [navigation.tabs, navigation.sections, navigation.top, content.code.copy, search.highlight]
markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        # Class "diagram", not "mermaid": Material would render it into a closed shadow
        # root that can't be zoomed. docs/javascripts/diagrams.js renders it instead.
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/diagrams.css
extra_javascript:
  - javascripts/diagrams.js
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/mastif/src, packages/mastif-testing/src]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
