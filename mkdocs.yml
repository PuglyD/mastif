site_name: mastif
theme:
  name: material
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
  features: [navigation.tabs, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - {name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format}
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/mastif/src]
          options: {docstring_style: google}
nav:
  - Home: index.md
  - Plan: plan.md
  - Decisions:
      - adr/0000-template.md
      - adr/0001-home-grown-units.md
      - adr/0002-result-model.md
