site_name: mastif
site_description: A domain-neutral framework for automated test equipment
repo_url: https://github.com/PuglyD/mastif
repo_name: PuglyD/mastif
watch:
  - packages/mastif/src
  - packages/mastif-testing/src
theme:
  name: material
  font: false
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        # Class "diagram", not "mermaid": Material would render it into a closed shadow
        # root that can't be zoomed. docs/javascripts/diagrams.js renders it instead.
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/diagrams.css
  - stylesheets/site.css
extra_javascript:
  - javascripts/diagrams.js
  - javascripts/terminals.js
  - javascripts/toc.js
plugins:
  - search
  - termynal:
      title: mastif · simulated example
      buttons: macos
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/mastif/src, packages/mastif-testing/src]
          options:
            docstring_style: google
            show_if_no_docstring: true
            filters: []
            show_source: false
            members_order: source
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_section_style: spacy
            heading_level: 2
