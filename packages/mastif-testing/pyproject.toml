[project]
name = "mastif-testing"
version = "0.1.0.dev0"
description = "Fakes, simulators and conformance helpers for mastif SDK authors."
requires-python = ">=3.12"
dependencies = ["mastif"]

[tool.uv.sources]
mastif = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastif_testing"]
