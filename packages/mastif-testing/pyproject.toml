[project]
name = "mastif-testing"
version = "0.1.0.dev0"
description = "Fakes, simulators and conformance helpers for mastif SDK authors."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["mastif"]

[tool.uv.sources]
mastif = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 adds PEP 639 licence metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastif_testing"]
