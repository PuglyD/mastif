[project]
name = "mastif"
version = "0.1.0.dev0"
description = "Domain-neutral framework for automated test equipment: tests, instruments and DUTs."
requires-python = ">=3.12"
dependencies = [
    "dynaconf>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
visa = ["pyvisa>=1.14"]
pandas = ["pandas>=2.0"]  # optional: log DataFrames as tables

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastif"]

[tool.hatch.build.hooks.custom]
# hatch_build.py embeds git information into wheels (see ADR on version information).
