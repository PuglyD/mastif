[project]
name = "mastif"
version = "0.1.0.dev0"
description = "Domain-neutral framework for automated test equipment: tests, instruments and DUTs."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "dynaconf>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13",
    # telnetlib left the stdlib in 3.13; this is the same module, repackaged (PSF licence).
    # On 3.12 the stdlib copy is used (ADR-0032).
    "telnetlib-313-and-up>=3.13.1; python_version >= '3.13'",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
visa = ["pyvisa>=1.14"]
ssh = ["paramiko>=3.4"]  # LGPL-2.1, AGPL-compatible (ADR-0031, ADR-0033)
pandas = ["pandas>=2.0"]  # optional: log DataFrames as tables

[build-system]
requires = ["hatchling>=1.27"]  # 1.27 adds PEP 639 licence metadata
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastif"]

[tool.hatch.build.hooks.custom]
# hatch_build.py embeds git information into wheels (see ADR on version information).
