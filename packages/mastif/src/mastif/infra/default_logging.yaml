# mastif's bundled logging configuration (standard logging.config.dictConfig schema).
# Copy it into your app's config directory as logging.yaml to customise it.
version: 1
disable_existing_loggers: false

formatters:
  console:
    format: "%(message)s"
  detailed:
    (): mastif.infra.logs.TableAwareFormatter
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:                       # what the operator sees
    (): mastif.infra.logs.RichTableHandler
    level: INFO
    formatter: console
    rich_tracebacks: true
    show_path: false
  file:                          # everything, for investigating failures
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: mastif.log         # relative names are placed under log_dir
    maxBytes: 10485760           # 10 MB
    backupCount: 5
    encoding: utf-8

loggers:
  mastif.io:                     # raw instrument traffic: file only, never the console
    level: DEBUG
    handlers: [file]
    propagate: false

root:
  level: DEBUG
  handlers: [console, file]
